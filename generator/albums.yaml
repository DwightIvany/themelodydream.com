# Album data — single source of truth for album pages AND hub-page sections.
#
# Track fields: name (required), mp3, lyrics (optional link hrefs), num
# (optional display number override), raw (optional: emit this exact HTML
# instead of a generated numbered line).
# trailing: raw HTML emitted after the tracks </p> (disclaimers/credits).
#
# file:     generates a standalone album page at the repo root.
# hub:      list of hub pages that include this album as a section
#           (hub pages: LostDog.html=lostdog, Disco1.html=disco1, CrAvery.html=cravery).
# anchor:   the <a name="..."> before a hub section. Plain scalar = same on all
#           hubs; dict = per-hub (e.g. {lostdog: Aif, disco1: AifAlbum}).
#           Keep stable — sidebar and other pages link to these.
# h2_raw:   optional verbatim <h2> HTML for albums whose heading isn't the
#           standard "Artist<br>Name" (linked artist names, cover inside h2).
# cover:    album cover image under Images/ (omit if the cover lives in h2_raw).
# Order of sections on each hub page: site.yaml -> hubs.<name>.order.

